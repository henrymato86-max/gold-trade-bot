name: XAUUSD Trade Analysis Cron

on:
  schedule:
    # Runs every 4 hours automatically 24/7
    - cron: '0 */4 * * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai twelvedata requests

      - name: Execute Trade Engine
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_trade_engine.py
